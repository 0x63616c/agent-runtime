name: main-ci

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out immutable revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install pinned Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install pinned just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.58.0
      - name: Check generated ownership drift
        run: go run ./cmd/generate-requirement-manifest --check
      - name: Run pinned lint policy
        uses: golangci/golangci-lint-action@d583c34f0599d37dbac4a198b9c83201be380893 # v9.3.0
        with:
          version: v2.12.2
          args: --timeout=5m
      - name: Run incremental direct-main gate
        id: incremental
        run: just check
      - name: Retain bounded main-CI evidence
        if: always() && steps.incremental.outcome != 'skipped'
        env:
          CHECK_EVENT: ${{ steps.incremental.outcome == 'success' && 'main_ci' || 'red_main_halt' }}
          CHECK_RESULT: ${{ steps.incremental.outcome == 'success' && 'passed' || 'failed' }}
        run: >-
          go run ./cmd/afk-evidence -mode record
          -event "$CHECK_EVENT"
          -requirements MON-004,MON-005,MON-006,MON-007,MON-008
          -seams S2,S11,S12
          -documentation AGENTS.md,CONTEXT.md,docs/architecture/system.md,docs/operations/direct-main.md
          -revision "$GITHUB_SHA"
          -source-ref refs/heads/main
          -utc-time "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          -proof-level main_ci
          -command-id just-check
          -artifact-ref "gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          -result "$CHECK_RESULT"
          -limitations immutable-main-ci-only-no-release-proof
          > afk-main-ci.json
      - name: Upload bounded evidence
        if: always() && hashFiles('afk-main-ci.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: afk-main-ci-${{ github.sha }}
          path: afk-main-ci.json
          if-no-files-found: error
          retention-days: 90

  docs:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Check out immutable revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install locked Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: website/package-lock.json
      - name: Install pinned Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install pinned just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.58.0
      - name: Validate public documentation
        run: just docs-check

  two-stack-isolation:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out immutable revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Install pinned Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install pinned just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.58.0
      - name: Install checksum-verified cluster tools
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/bin"
          curl -fsSLo "$RUNNER_TEMP/bin/k3d" https://github.com/k3d-io/k3d/releases/download/v5.9.0/k3d-linux-amd64
          echo "06d8f25bc3a971c4eb29e0ff08429b180402db0f4dec838c9eac427e296800a0  $RUNNER_TEMP/bin/k3d" | sha256sum -c -
          curl -fsSLo "$RUNNER_TEMP/bin/kubectl" https://dl.k8s.io/release/v1.33.9/bin/linux/amd64/kubectl
          echo "9e33e3234c0842cd44a12c13e334b4ce930145ea84b855ce7cc0a7b6bc670c22  $RUNNER_TEMP/bin/kubectl" | sha256sum -c -
          curl -fsSLo "$RUNNER_TEMP/tilt.tar.gz" https://github.com/tilt-dev/tilt/releases/download/v0.37.6/tilt.0.37.6.linux.x86_64.tar.gz
          echo "e9672b8a18d43501f35dcfe98465969a7db0e436b36cf0c50c7e6f8d40de5fe6  $RUNNER_TEMP/tilt.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/tilt.tar.gz" -C "$RUNNER_TEMP/bin" tilt
          chmod 0755 "$RUNNER_TEMP/bin/k3d" "$RUNNER_TEMP/bin/kubectl" "$RUNNER_TEMP/bin/tilt"
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - name: Create pinned disposable cluster
        shell: bash
        run: |
          set -euo pipefail
          run_identity="${GITHUB_RUN_ID:?}-${GITHUB_RUN_ATTEMPT:?}"
          [[ "$run_identity" =~ ^[1-9][0-9]*-[1-9][0-9]*$ ]]
          # k3d limits cluster names to 32 characters; preserve room for the
          # generated GitHub run/attempt identity rather than truncating it.
          cluster="ar-ci-$run_identity"
          registry="ar-reg-$run_identity.localhost"
          context="k3d-$cluster"
          kubeconfig="$RUNNER_TEMP/$cluster.kubeconfig"
          api_port="$(python3 - "$run_identity" <<'PY'
          import hashlib
          import socket
          import sys

          start = 20000 + int.from_bytes(hashlib.sha256(sys.argv[1].encode()).digest()[:2], "big") % 20000
          for offset in range(20000):
              candidate = 20000 + (start - 20000 + offset) % 20000
              probe = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
              try:
                  probe.bind(("127.0.0.1", candidate))
              except OSError:
                  continue
              finally:
                  probe.close()
              print(candidate)
              break
          else:
              raise SystemExit("no free generated loopback API port")
          PY
          )"
          [[ "$api_port" =~ ^[1-9][0-9]{0,4}$ ]]
          registry_port="$(python3 - "$run_identity" <<'PY'
          import hashlib
          import socket
          import sys

          start = 40000 + int.from_bytes(hashlib.sha256(sys.argv[1].encode()).digest()[2:4], "big") % 20000
          for offset in range(20000):
              candidate = 40000 + (start - 40000 + offset) % 20000
              probe = socket.socket(socket.AF_INET, socket.SOCK_STREAM)
              try:
                  probe.bind(("127.0.0.1", candidate))
              except OSError:
                  continue
              finally:
                  probe.close()
              print(candidate)
              break
          else:
              raise SystemExit("no free generated loopback registry port")
          PY
          )"
          [[ "$registry_port" =~ ^[1-9][0-9]{0,4}$ ]]
          [[ "$registry_port" != "$api_port" ]]
          registry_container="k3d-$registry"
          cluster_server_container="k3d-${cluster}-server-0"
          ownership_record="$RUNNER_TEMP/k3d-ownership.json"
          cluster_create_succeeded=false
          registry_create_succeeded=false
          registry_container_id=""
          cluster_server_container_id=""
          test ! -e "$ownership_record"
          test ! -e "$kubeconfig"
          if k3d cluster list -o json | jq -e --arg name "$cluster" 'any(.[]; .name == $name)' >/dev/null; then
            echo "refusing to reuse pre-existing generated k3d cluster $cluster" >&2
            exit 1
          fi
          if k3d registry list -o json | jq -e --arg name "$registry" 'any(.[]; .name == $name)' >/dev/null; then
            echo "refusing to reuse pre-existing generated k3d registry $registry" >&2
            exit 1
          fi
          write_ownership_record() {
            jq -n --arg run_identity "$run_identity" --arg cluster "$cluster" --arg registry "$registry" --arg context "$context" --arg kubeconfig "$kubeconfig" \
              --arg registry_container "$registry_container" --arg registry_container_id "$registry_container_id" \
              --arg cluster_server_container "$cluster_server_container" --arg cluster_server_container_id "$cluster_server_container_id" \
              --argjson cluster_create_succeeded "$cluster_create_succeeded" --argjson registry_create_succeeded "$registry_create_succeeded" \
              '{version:2,run_identity:$run_identity,cluster:$cluster,registry:$registry,context:$context,kubeconfig:$kubeconfig,registry_container:$registry_container,registry_container_id:$registry_container_id,cluster_server_container:$cluster_server_container,cluster_server_container_id:$cluster_server_container_id,cluster_create_succeeded:$cluster_create_succeeded,registry_create_succeeded:$registry_create_succeeded}' \
              > "$ownership_record"
          }
          container_identity_matches() {
            container_name="$1"
            expected_id="$2"
            observed_id="$(docker container inspect --format '{{.Id}}' "$container_name" 2>/dev/null)" || return 1
            [[ -n "$expected_id" && "$observed_id" == "$expected_id" ]]
          }
          cleanup_owned_resources() {
            status=$?
            set +e
            if [[ "$cluster_create_succeeded" == true ]] && k3d cluster list -o json | jq -e --arg name "$cluster" 'any(.[]; .name == $name)' >/dev/null; then
              if container_identity_matches "$cluster_server_container" "$cluster_server_container_id"; then
                k3d cluster delete "$cluster"
              else
                echo "refusing to delete k3d cluster with mismatched server container identity; retained for diagnosis" >&2
              fi
            fi
            if [[ "$registry_create_succeeded" == true ]] && k3d registry list -o json | jq -e --arg name "$registry" 'any(.[]; .name == $name)' >/dev/null; then
              if container_identity_matches "$registry_container" "$registry_container_id"; then
                k3d registry delete "$registry"
              else
                echo "refusing to delete k3d registry with mismatched container identity; retained for diagnosis" >&2
              fi
            fi
            trap - EXIT
            exit "$status"
          }
          trap cleanup_owned_resources EXIT
          export KUBECONFIG="$kubeconfig"
          write_ownership_record
          if k3d registry create "$registry" \
            --image registry:2.8.3@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373 \
            --port "127.0.0.1:$registry_port"; then
            registry_create_succeeded=true
            registry_container_id="$(docker container inspect --format '{{.Id}}' "$registry_container")"
            [[ "$registry_container_id" =~ ^[a-f0-9]{64}$ ]]
            registry_host_port="$(docker container inspect "$registry_container" | jq -er --arg port "5000/tcp" '.[0].NetworkSettings.Ports[$port] | if type == "array" and length == 1 and .[0].HostIp == "127.0.0.1" and (.[0].HostPort | test("^[1-9][0-9]{0,4}$")) then .[0].HostPort else error("expected one loopback registry port mapping") end')"
            (( registry_host_port <= 65535 ))
            registry_host="localhost:$registry_host_port"
            registry_host_from_cluster="k3d-$registry:5000"
            write_ownership_record
          else
            write_ownership_record
            echo "failed k3d registry creation is retained for diagnosis without deletion" >&2
            exit 1
          fi
          write_ownership_record
          if k3d cluster create "$cluster" \
            --image rancher/k3s:v1.33.9-k3s1@sha256:f17e43023cce2b9c613e198f26e73637bf734b5156d37c9f44819d97bac4d655 \
            --api-port "127.0.0.1:$api_port" \
            --registry-use "$registry_host_from_cluster" \
            --kubeconfig-update-default=false \
            --kubeconfig-switch-context=false \
            --k3s-arg '--disable=traefik@server:0' \
            --k3s-arg '--disable=servicelb@server:0' \
            --wait --timeout 5m; then
            cluster_create_succeeded=true
            cluster_server_container_id="$(docker container inspect --format '{{.Id}}' "$cluster_server_container")"
            [[ "$cluster_server_container_id" =~ ^[a-f0-9]{64}$ ]]
            write_ownership_record
          else
            write_ownership_record
            echo "failed k3d cluster creation is retained for diagnosis without deletion" >&2
            exit 1
          fi
          k3d kubeconfig get "$cluster" > "$kubeconfig"
          api_endpoint="$(kubectl config view --raw --minify -o jsonpath='{.clusters[0].cluster.server}')"
          api_port="${api_endpoint##*:}"
          [[ "$api_endpoint" == "https://127.0.0.1:$api_port" ]]
          [[ "$api_port" =~ ^[1-9][0-9]{0,4}$ ]]
          (( api_port <= 65535 ))
          kubectl --context "$context" wait --for=condition=Ready node --all --timeout=5m
          {
            echo "KUBECONFIG=$kubeconfig"
            echo "AGENT_RUNTIME_CI_RUN_IDENTITY=$run_identity"
            echo "AGENT_RUNTIME_CI_CLUSTER=$cluster"
            echo "AGENT_RUNTIME_CI_CONTEXT=$context"
            echo "AGENT_RUNTIME_CI_REGISTRY_HOST=$registry_host"
            echo "AGENT_RUNTIME_CI_REGISTRY_HOST_FROM_CLUSTER=$registry_host_from_cluster"
          } >> "$GITHUB_ENV"
          trap - EXIT
      - name: Preload and prove the local-path helper image
        shell: bash
        run: |
          set -euo pipefail
          cluster="${AGENT_RUNTIME_CI_CLUSTER:?}"
          context="${AGENT_RUNTIME_CI_CONTEXT:?}"
          provisioner_namespace=kube-system
          preflight_namespace="agent-runtime-local-path-preflight-${AGENT_RUNTIME_CI_RUN_IDENTITY:?}"
          helper_image=rancher/mirrored-library-busybox:1.37.0
          helper_digest_ref=rancher/mirrored-library-busybox@sha256:101b4afd76732482eff9b95cae5f94bcf295e521fbec4e01b69c5421f3f3f3e5
          helper_record="$RUNNER_TEMP/local-path-helper-evidence.json"
          test ! -e "$helper_record"
          if kubectl --context "$context" get "namespace/$preflight_namespace" >/dev/null 2>&1; then
            echo "refusing to adopt pre-existing helper preflight namespace $preflight_namespace" >&2
            exit 1
          fi
          cleanup() {
            local status=$?
            set +e
            kubectl --context "$context" delete "namespace/$preflight_namespace" --wait=true --timeout=120s >/dev/null 2>&1 || true
            trap - EXIT
            exit "$status"
          }
          trap cleanup EXIT

          helper_pod_yaml=""
          for attempt in $(seq 1 60); do
            if helper_pod_yaml="$(kubectl --context "$context" --namespace "$provisioner_namespace" get configmap local-path-config -o json 2>/dev/null | jq -er '.data["helperPod.yaml"]' 2>/dev/null)"; then
              break
            fi
            if [[ "$attempt" == 60 ]]; then
              echo "local-path helper configuration did not become available" >&2
              exit 1
            fi
            sleep 2
          done
          configured_helper_image="$(printf '%s\n' "$helper_pod_yaml" | sed -nE 's/^[[:space:]]*image:[[:space:]]*([^[:space:]#]+).*$/\1/p' | head -n 1)"
          configured_pull_policy="$(printf '%s\n' "$helper_pod_yaml" | sed -nE 's/^[[:space:]]*imagePullPolicy:[[:space:]]*([^[:space:]#]+).*$/\1/p' | head -n 1)"
          [[ "$configured_helper_image" == "$helper_image" ]]
          [[ "$configured_pull_policy" == IfNotPresent ]]

          timeout 60s docker buildx imagetools inspect --raw "$helper_digest_ref" > "$RUNNER_TEMP/local-path-helper-index.json"
          jq -e '
            .manifests != null and
            ([.manifests[] | select(.platform.os == "linux") | .platform.architecture] | contains(["amd64", "arm64"]))
          ' "$RUNNER_TEMP/local-path-helper-index.json" >/dev/null
          timeout 120s docker pull "$helper_digest_ref"
          helper_repo_digests="$(docker image inspect "$helper_digest_ref" --format '{{range .RepoDigests}}{{println .}}{{end}}')"
          if [[ "$helper_repo_digests" != *"$helper_digest_ref"* && "$helper_repo_digests" != *"docker.io/$helper_digest_ref"* ]]; then
            echo "host helper image did not retain the reviewed immutable digest" >&2
            exit 1
          fi
          node_arch="$(kubectl --context "$context" get node --no-headers -o json | jq -er '.items | if length == 1 then .[0].status.nodeInfo.architecture else error("expected exactly one isolated K3s node") end')"
          helper_platform_digest="$(jq -er --arg architecture "$node_arch" '
            [.manifests[] | select(.platform.os == "linux" and .platform.architecture == $architecture) | .digest] |
            if length == 1 then .[0] else error("reviewed helper index does not contain exactly one node platform manifest") end
          ' "$RUNNER_TEMP/local-path-helper-index.json")"
          helper_platform_ref="rancher/mirrored-library-busybox@$helper_platform_digest"
          timeout 120s docker pull --platform "linux/$node_arch" "$helper_platform_ref"
          helper_platform_repo_digests="$(docker image inspect "$helper_platform_ref" --format '{{range .RepoDigests}}{{println .}}{{end}}')"
          if [[ "$helper_platform_repo_digests" != *"$helper_platform_ref"* && "$helper_platform_repo_digests" != *"docker.io/$helper_platform_ref"* ]]; then
            echo "host helper image did not retain the reviewed node-platform manifest digest" >&2
            exit 1
          fi
          docker tag "$helper_platform_ref" "$helper_image"
          k3d image import "$helper_image" --cluster "$cluster" --mode direct
          timeout 120s docker exec "k3d-${cluster}-server-0" crictl pull "$helper_digest_ref"

          for attempt in $(seq 1 30); do
            if docker exec "k3d-${cluster}-server-0" crictl images -o json | jq -e --arg tag "$helper_image" --arg digest "$helper_digest_ref" '
              any(.images[];
                (.repoTags // [] | any(. == $tag or . == ("docker.io/" + $tag))) and
                (.repoDigests // [] | any(. == $digest or . == ("docker.io/" + $digest)))
              )
            ' >/dev/null; then
              break
            fi
            if [[ "$attempt" == 30 ]]; then
              echo "imported local-path helper image was not present in the K3s container runtime" >&2
              exit 1
            fi
            sleep 2
          done
          kubectl --context "$context" --namespace "$provisioner_namespace" rollout status deployment/local-path-provisioner --timeout=60s
          kubectl --context "$context" create namespace "$preflight_namespace"
          kubectl --context "$context" --namespace "$preflight_namespace" create -f - <<'EOF'
          apiVersion: v1
          kind: PersistentVolumeClaim
          metadata:
            name: local-path-helper-readiness
          spec:
            accessModes:
              - ReadWriteOnce
            storageClassName: local-path
            resources:
              requests:
                storage: 1Mi
          EOF
          kubectl --context "$context" --namespace "$preflight_namespace" create -f - <<EOF
          apiVersion: v1
          kind: Pod
          metadata:
            name: local-path-helper-consumer
          spec:
            restartPolicy: Never
            automountServiceAccountToken: false
            containers:
              - name: consumer
                image: $helper_image
                imagePullPolicy: IfNotPresent
                command: ["/bin/sh", "-c", "sleep 90"]
                volumeMounts:
                  - name: local-path
                    mountPath: /mnt/local-path
                resources:
                  requests:
                    cpu: 10m
                    memory: 16Mi
                  limits:
                    cpu: 100m
                    memory: 64Mi
            volumes:
              - name: local-path
                persistentVolumeClaim:
                  claimName: local-path-helper-readiness
          EOF
          kubectl --context "$context" --namespace "$preflight_namespace" wait --for=jsonpath='{.status.phase}'=Running pod/local-path-helper-consumer --timeout=120s
          kubectl --context "$context" --namespace "$preflight_namespace" wait --for=jsonpath='{.status.phase}'=Bound persistentvolumeclaim/local-path-helper-readiness --timeout=120s
          kubectl --context "$context" delete "namespace/$preflight_namespace" --wait=true --timeout=120s
          trap - EXIT
          jq -n \
            --arg configured_image "$configured_helper_image" \
            --arg immutable_digest_ref "$helper_digest_ref" \
            --arg node_architecture "$node_arch" \
            --arg platform_manifest_digest "$helper_platform_digest" \
            --arg pull_policy "$configured_pull_policy" \
            '{version:1,configured_image:$configured_image,immutable_digest_ref:$immutable_digest_ref,node_architecture:$node_architecture,platform_manifest_digest:$platform_manifest_digest,pull_policy:$pull_policy,multi_architecture_index:true,host_pull:{count:2,bound_seconds:120},k3d_platform_import:true,k3s_runtime_digest_pull:true,k3s_runtime_image_present:true,provisioner_ready:true,helper_pvc_bound:true,cleanup:{preflight_namespace_absent:true}}' > "$helper_record"
      - name: Prove two isolated full Stack instances
        env:
          AGENT_RUNTIME_DEV_CONTEXT: ${{ env.AGENT_RUNTIME_CI_CONTEXT }}
          AGENT_RUNTIME_DEV_PROFILE: ci
          AGENT_RUNTIME_DEV_STACK_A: ci-isolation-a
          AGENT_RUNTIME_DEV_STACK_B: ci-isolation-b
          AGENT_RUNTIME_TWO_STACK_EVIDENCE: ${{ runner.temp }}/two-stack-evidence.json
          AGENT_RUNTIME_TWO_STACK_DIAGNOSTICS: ${{ runner.temp }}/two-stack-diagnostics
          AGENT_RUNTIME_CI_CONTEXT: ${{ env.AGENT_RUNTIME_CI_CONTEXT }}
          AGENT_RUNTIME_CI_REGISTRY_HOST: ${{ env.AGENT_RUNTIME_CI_REGISTRY_HOST }}
          AGENT_RUNTIME_CI_REGISTRY_HOST_FROM_CLUSTER: ${{ env.AGENT_RUNTIME_CI_REGISTRY_HOST_FROM_CLUSTER }}
          AGENT_RUNTIME_CLUSTER_RUNTIME: k3d-v5.9.0
          AGENT_RUNTIME_CLUSTER_IMAGE: rancher/k3s:v1.33.9-k3s1@sha256:f17e43023cce2b9c613e198f26e73637bf734b5156d37c9f44819d97bac4d655
          AGENT_RUNTIME_REGISTRY_IMAGE: registry:2.8.3@sha256:a3d8aaa63ed8681a604f1dea0aa03f100d5895b6a58ace528858a7b332415373
          AGENT_RUNTIME_KUBECTL_VERSION: v1.33.9
          AGENT_RUNTIME_TILT_VERSION: v0.37.6
        run: just two-stack-smoke ci "$AGENT_RUNTIME_CI_CONTEXT" "$RUNNER_TEMP/two-stack-evidence.json"
      - name: Upload two-Stack evidence and allowlisted diagnostics
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: two-stack-isolation-${{ github.sha }}
          path: |
            ${{ runner.temp }}/two-stack-evidence.json
            ${{ runner.temp }}/local-path-helper-evidence.json
            ${{ runner.temp }}/two-stack-diagnostics/*.summary.json
            ${{ runner.temp }}/k3d-ownership.json
          if-no-files-found: error
          retention-days: 30
      - name: Delete disposable cluster
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          ownership_record="$RUNNER_TEMP/k3d-ownership.json"
          [[ -f "$ownership_record" ]] || exit 0
          run_identity="$(jq -er '.run_identity | select(test("^[1-9][0-9]*-[1-9][0-9]*$"))' "$ownership_record")"
          cluster="$(jq -er --arg run_identity "$run_identity" '.cluster | select(. == "ar-ci-" + $run_identity)' "$ownership_record")"
          registry="$(jq -er --arg run_identity "$run_identity" '.registry | select(. == "ar-reg-" + $run_identity + ".localhost")' "$ownership_record")"
          registry_container="$(jq -er '.registry_container' "$ownership_record")"
          registry_container_id="$(jq -er '.registry_container_id' "$ownership_record")"
          cluster_server_container="$(jq -er '.cluster_server_container' "$ownership_record")"
          cluster_server_container_id="$(jq -er '.cluster_server_container_id' "$ownership_record")"
          cluster_create_succeeded="$(jq -er '.cluster_create_succeeded | if type == "boolean" then . else error("cluster_create_succeeded must be boolean") end' "$ownership_record")"
          registry_create_succeeded="$(jq -er '.registry_create_succeeded | if type == "boolean" then . else error("registry_create_succeeded must be boolean") end' "$ownership_record")"
          [[ "$registry_container" == "k3d-$registry" ]]
          [[ "$cluster_server_container" == "k3d-${cluster}-server-0" ]]
          container_identity_matches() {
            container_name="$1"
            expected_id="$2"
            observed_id="$(docker container inspect --format '{{.Id}}' "$container_name" 2>/dev/null)" || return 1
            [[ -n "$expected_id" && "$observed_id" == "$expected_id" ]]
          }
          if [[ "$cluster_create_succeeded" == true ]] && k3d cluster list -o json | jq -e --arg name "$cluster" 'any(.[]; .name == $name)' >/dev/null; then
            if container_identity_matches "$cluster_server_container" "$cluster_server_container_id"; then
              k3d cluster delete "$cluster"
            else
              echo "refusing to delete k3d cluster with mismatched server container identity; retained for diagnosis" >&2
            fi
          fi
          if [[ "$registry_create_succeeded" == true ]] && k3d registry list -o json | jq -e --arg name "$registry" 'any(.[]; .name == $name)' >/dev/null; then
            if container_identity_matches "$registry_container" "$registry_container_id"; then
              k3d registry delete "$registry"
            else
              echo "refusing to delete k3d registry with mismatched container identity; retained for diagnosis" >&2
            fi
          fi
