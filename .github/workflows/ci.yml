name: main-ci

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: main-ci-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Check out immutable revision
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
      - name: Install pinned Go
        uses: actions/setup-go@7a3fe6cf4cb3a834922a1244abfce67bcef6a0c5 # v6.2.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install pinned just
        uses: extractions/setup-just@f8a3cce218d9f83db3a2ecd90e41ac3de6cdfd9b # v3
        with:
          just-version: 1.58.0
      - name: Check generated ownership drift
        run: go run ./cmd/generate-requirement-manifest --check
      - name: Run pinned lint policy
        uses: golangci/golangci-lint-action@4afd733a84b1f43292c63897423277bb7f4313a9 # v8
        with:
          version: v2.4.0
          args: --timeout=5m
      - name: Run incremental direct-main gate
        id: check
        continue-on-error: true
        run: just check
      - name: Retain bounded main-CI evidence
        if: always() && steps.check.outcome != 'skipped'
        env:
          CHECK_EVENT: ${{ steps.check.outcome == 'success' && 'main_ci' || 'red_main_halt' }}
          CHECK_RESULT: ${{ steps.check.outcome == 'success' && 'passed' || 'failed' }}
        run: >-
          go run ./cmd/afk-evidence -mode record
          -event "$CHECK_EVENT"
          -requirements MON-004,MON-005,MON-006,MON-007,MON-008
          -seams S2,S11,S12
          -documentation AGENTS.md,CONTEXT.md,docs/architecture/system.md,docs/operations/direct-main.md
          -revision "$GITHUB_SHA"
          -source-ref refs/heads/main
          -utc-time "$(date -u +%Y-%m-%dT%H:%M:%SZ)"
          -proof-level main_ci
          -command-id just-check
          -artifact-ref "gha-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          -result "$CHECK_RESULT"
          -limitations immutable-main-ci-only-no-release-proof
          > afk-main-ci.json
      - name: Upload bounded evidence
        if: always() && hashFiles('afk-main-ci.json') != ''
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: afk-main-ci-${{ github.sha }}
          path: afk-main-ci.json
          if-no-files-found: error
          retention-days: 90
      - name: Halt on red main
        if: steps.check.outcome != 'success'
        run: exit 1
