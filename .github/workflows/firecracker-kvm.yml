name: firecracker-kvm

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: protected-linux-kvm-preflight
    runs-on: [self-hosted, linux, x64, kvm, firecracker-protected]
    environment: firecracker-kvm
    timeout-minutes: 15
    steps:
      - name: Check out immutable revision
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned Go
        uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod
          cache: true
      - name: Install pinned just
        uses: extractions/setup-just@53165ef7e734c5c07cb06b3c8e7b647c5aa16db3 # v4
        with:
          just-version: 1.58.0
      - name: Run fail-closed KVM preflight
        env:
          FIRECRACKER_RUNNER_CONTRACT: protected-linux-kvm-v1
          GITHUB_REF_PROTECTED: "true"
          FIRECRACKER_GITHUB_ENVIRONMENT: firecracker-kvm
          FIRECRACKER_RUNNER_LABELS: self-hosted,linux,x64,kvm,firecracker-protected
          FIRECRACKER_RUNNER_BOOTSTRAP_CONFIG: /etc/agent-runtime/firecracker-kvm-runner.json
          FIRECRACKER_JAILER_UID: ${{ vars.FIRECRACKER_JAILER_UID }}
          FIRECRACKER_JAILER_GID: ${{ vars.FIRECRACKER_JAILER_GID }}
          FIRECRACKER_CGROUP_PARENT: ${{ vars.FIRECRACKER_CGROUP_PARENT }}
          FIRECRACKER_STACK_RESOURCE: ${{ vars.FIRECRACKER_STACK_RESOURCE }}
          FIRECRACKER_EXTERNAL_OWNER: ${{ vars.FIRECRACKER_EXTERNAL_OWNER }}
          FIRECRACKER_FIXTURE_LOCK: ${{ vars.FIRECRACKER_FIXTURE_LOCK }}
        run: |
          go run ./cmd/firecracker-runner-preflight \
            -fixture-lock "${FIRECRACKER_FIXTURE_LOCK:-tools/firecracker/fixtures.lock}"
          just firecracker-integration evidence/firecracker-kvm-report.json \
            smoke-${{ github.run_id }} "${FIRECRACKER_JAILER_UID:-0}" "${FIRECRACKER_JAILER_GID:-0}" \
            "$FIRECRACKER_CGROUP_PARENT" "$FIRECRACKER_STACK_RESOURCE" "$FIRECRACKER_EXTERNAL_OWNER" \
            "${FIRECRACKER_FIXTURE_LOCK:-tools/firecracker/fixtures.lock}"
      - name: Retain redacted protected-run report
        if: always() && hashFiles('evidence/firecracker-kvm-report.json') != ''
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: firecracker-kvm-${{ github.sha }}
          path: evidence/firecracker-kvm-report.json
          if-no-files-found: error
          retention-days: 90
