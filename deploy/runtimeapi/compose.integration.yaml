name: agent-runtime-api-integration

services:
  postgres:
    image: postgres@sha256:e5507c984377515b8c9922b0eb19f55aba2063fdc7bccf268cefd53133f97054
    environment:
      POSTGRES_DB: agent_runtime
      POSTGRES_USER: runtime_api
      POSTGRES_PASSWORD: ${AR_RUNTIME_API_POSTGRES_PASSWORD:?AR_RUNTIME_API_POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1::5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U runtime_api -d agent_runtime"]
      interval: 1s
      timeout: 2s
      retries: 30
    tmpfs:
      - /var/lib/postgresql/data:rw,noexec,nosuid,size=256m
      - /var/run/postgresql:rw,noexec,nosuid,size=16m
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - CHOWN
      - DAC_OVERRIDE
      - FOWNER
      - SETGID
      - SETUID
  minio:
    image: minio/minio@sha256:5045d7dbad98371ac49b6a6cd01e097e743f9c11fbd94e7991c1dda85bfcd275
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: ${AR_RUNTIME_API_MINIO_USER:?AR_RUNTIME_API_MINIO_USER is required}
      MINIO_ROOT_PASSWORD: ${AR_RUNTIME_API_MINIO_PASSWORD:?AR_RUNTIME_API_MINIO_PASSWORD is required}
    ports:
      - "127.0.0.1::9000"
    tmpfs:
      - /data:rw,noexec,nosuid,size=256m
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
